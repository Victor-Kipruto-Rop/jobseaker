name: CI

on:
  pull_request:
  push:
    branches: [main, "phase-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint, types, migrations and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobseeker
          POSTGRES_USER: jobseeker
          POSTGRES_PASSWORD: jobseeker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobseeker -d jobseeker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      APP_ENV: test
      APP_SECRET_KEY: ci-only-not-a-production-secret-000000000000000000000000000000
      DATABASE_URL: postgresql+psycopg://jobseeker:jobseeker_test@localhost:5432/jobseeker
      JOBSEEKER_TEST_DATABASE_URL: postgresql+psycopg://jobseeker:jobseeker_test@localhost:5432/jobseeker
      REDIS_URL: redis://localhost:6379/0
      GLOBAL_AUTOMATION_PAUSED: "true"
      AUTO_EMAIL_SEND: "false"
      AUTO_APPLICATION_SUBMIT: "false"
      GMAIL_ENABLED: "false"
      JOB_DISCOVERY_ENABLED: "false"
      AI_DEFAULT_PROVIDER: mock
      AI_FALLBACK_PROVIDER: mock
      OPENAI_ENABLED: "false"
      ANTHROPIC_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" mypy pip-audit
      - name: Compile Python
        run: python -m compileall -q apps packages tests migrations scripts
      - name: Ruff
        run: ruff check .
      - name: Python type check
        run: mypy apps/api packages --ignore-missing-imports --follow-imports=silent
      - name: Apply migrations to clean PostgreSQL
        run: alembic upgrade head
      - name: Check migration drift
        run: alembic check
      - name: Python tests with coverage report
        run: pytest -q --cov=apps.api.app --cov=packages --cov-report=term-missing
      - name: Dependency vulnerability audit
        run: pip-audit

  web:
    name: Web type check, build and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        working-directory: apps/web
        run: pnpm install --no-frozen-lockfile
      - name: TypeScript check
        working-directory: apps/web
        run: pnpm lint
      - name: Production build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: pnpm build
      - name: Production dependency audit
        working-directory: apps/web
        run: pnpm audit --prod --audit-level high

  docker:
    name: Build service images and validate Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local-only environment
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose -f infrastructure/compose/docker-compose.yml config --quiet
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t jobseeker-api:ci .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:8000 -t jobseeker-web:ci .
      - name: Build worker image
        run: docker build -f apps/worker/Dockerfile -t jobseeker-worker:ci .
      - name: Build scheduler image
        run: docker build -f apps/scheduler/Dockerfile -t jobseeker-scheduler:ci .
