services:
  postgres:
    image: postgres:16-alpine
    container_name: jobseeker-postgres-local
    environment:
      POSTGRES_DB: jobseeker
      POSTGRES_USER: jobseeker
      POSTGRES_PASSWORD: jobseeker_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - jobseeker_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobseeker -d jobseeker"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: jobseeker-redis-local
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - jobseeker_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  jobseeker:
    build: .
    container_name: jobseeker-local
    env_file:
      - .env
    environment:
      APP_ENV: local
      ADMIN_BOOTSTRAP_ENABLED: "false"
      AI_DEFAULT_PROVIDER: mock
      AI_FALLBACK_PROVIDER: mock
      OPENAI_ENABLED: "false"
      OPENAI_API_KEY: ""
      ANTHROPIC_ENABLED: "false"
      ANTHROPIC_API_KEY: ""
      SMTP_HOST: ""
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM_EMAIL: ""
      GMAIL_CLIENT_SECRET_FILE: ""
      DATABASE_URL: postgresql+psycopg://jobseeker:jobseeker_local_only@postgres:5432/jobseeker
      REDIS_URL: redis://redis:6379/0
      GLOBAL_AUTOMATION_PAUSED: "true"
      AUTO_EMAIL_SEND: "false"
      AUTO_APPLICATION_SUBMIT: "false"
      GMAIL_ENABLED: "false"
      JOB_DISCOVERY_ENABLED: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - jobseeker_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  jobseeker_data:
  jobseeker_postgres_data:
  jobseeker_redis_data:
