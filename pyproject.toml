[build-system]
requires=["setuptools>=69","wheel"]
build-backend="setuptools.build_meta"
[project]
name="jobseeker-intelligence"
version="0.2.0"
requires-python=">=3.12"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","pydantic>=2.8,<3","pydantic-settings>=2.4,<3","sqlalchemy>=2,<3","psycopg[binary]>=3.2,<4","redis>=5,<6","rq>=2,<3","openai>=1.50,<3","anthropic>=0.39,<1","structlog>=24,<26","httpx>=0.27,<1"]
[project.optional-dependencies]
dev=["pytest>=8,<9","pytest-asyncio>=0.24,<2","ruff>=0.7,<1"]
[tool.pytest.ini_options]
pythonpath=[".","apps/api"]
testpaths=["tests","apps/api/tests"]
asyncio_mode="auto"
[tool.ruff]
line-length=100
target-version="py312"

[tool.setuptools.packages.find]
where=["."]
include=["apps*","packages*"]
