[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobseeker-intelligence"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3", "python-dotenv>=1,<2", "sqlalchemy>=2,<3",
  "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "redis>=5,<6", "rq>=2,<3", "rq-scheduler>=0.13.1,<1",
  "openai>=1.50,<3", "anthropic>=0.39,<1", "structlog>=24,<26",
  "httpx>=0.27,<1", "python-multipart>=0.0.9", "pwdlib[argon2]>=0.2,<1",
  "email-validator>=2,<3", "cryptography>=43,<47", "pypdf>=5,<7", "python-docx>=1.1,<2", "google-api-python-client>=2.150,<3",
  "google-auth>=2.35,<3", "google-auth-oauthlib>=1.2,<2",
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "pytest-cov>=5,<7", "ruff>=0.7,<1", "mypy>=1.11,<2"]
[tool.pytest.ini_options]
pythonpath = [".", "apps/api"]
testpaths = ["tests", "apps/api/tests"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint.flake8-bugbear]
# FastAPI parameter declarations are immutable dependency/validation descriptors.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.Cookie",
  "fastapi.Form",
  "fastapi.File",
  "fastapi.Security",
  "apps.api.app.dependencies.require_roles",
]
[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
